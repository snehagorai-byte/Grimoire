<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Study Quest · BCA + NEET</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Quicksand:wght@500;600;700&family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F4EA;--card:#FFFFFF;--ink:#2F3E3A;--mut:#74847E;--sage:#A9C3A4;--sage2:#7FA37B;--blue:#A9C6DC;--gold:#D6B35E;--line:#E4E8DC;--bad:#C9736B;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1E2825;--card:#27332F;--ink:#EDF1E6;--mut:#A3B3AB;--line:#37453F}}
:root[data-theme="dark"]{--bg:#1E2825;--card:#27332F;--ink:#EDF1E6;--mut:#A3B3AB;--line:#37453F}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Quicksand,system-ui,sans-serif;font-weight:600}
*{box-sizing:border-box}
h1,h2,.d{font-family:Fraunces,Georgia,serif;margin:0}
main{max-width:520px;margin:0 auto;padding:14px 14px 90px}
.hero{background:linear-gradient(160deg,var(--sage),var(--blue));border-radius:26px;padding:14px;color:#26382F;position:relative}
.hrow{display:flex;gap:10px;align-items:flex-end}
.av{width:104px;flex:none;border-radius:20px;background:rgba(255,255,255,.45)}
.bub{background:#FFFDF4;border-radius:18px 18px 18px 4px;padding:10px 12px;font-size:14px;line-height:1.35;color:#2F3E3A;flex:1;border:2px solid var(--gold)}
.bub small{display:block;color:#8A7A3E;margin-top:4px;font-size:11px}
.stats{display:flex;gap:8px;margin-top:12px;font-size:12px}
.stats div{background:rgba(255,255,255,.6);border-radius:12px;padding:6px 10px;flex:1;text-align:center}
.bar{height:10px;background:rgba(255,255,255,.7);border-radius:9px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#EBD28C);border-radius:9px;transition:width .5s}
.sec{margin:18px 4px 8px;font-size:18px}
.t{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin-bottom:8px}
.t.done{opacity:.55}.t.done .n{text-decoration:line-through}
.t.late{border-color:var(--bad)}
.tm{font-size:11px;color:var(--mut);width:46px;flex:none;line-height:1.3}
.n{flex:1;font-size:14px}.n small{display:block;color:var(--mut);font-weight:500;font-size:12px}
.ck{width:28px;height:28px;border-radius:50%;border:2px solid var(--sage2);background:none;color:#fff;font-size:15px;flex:none;cursor:pointer}
.done .ck{background:var(--sage2)}
.x{background:none;border:0;color:var(--mut);font-size:15px;cursor:pointer}
.late .tm{color:var(--bad)}
.k-college{border-left:5px solid var(--blue)}.k-neet{border-left:5px solid var(--gold)}.k-bca{border-left:5px solid var(--sage2)}
.k-math{border-left:5px solid #C7B6DD}.k-art{border-left:5px solid #EBC3B0}
button.b,input,select{font:inherit;border-radius:12px;border:1px solid var(--line);padding:9px 12px;background:var(--card);color:var(--ink)}
button.b{background:var(--sage2);color:#fff;border:0;cursor:pointer}
button.g{background:var(--gold)}
.row{display:flex;gap:6px;flex-wrap:wrap}.row>*{min-width:0}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:4px;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;max-width:110px;background:none;border:0;font:inherit;font-size:11px;color:var(--mut);padding:6px 0;border-radius:12px;cursor:pointer}
nav button b{display:block;font-size:19px}nav .on{background:var(--line);color:var(--ink)}
.grid{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card)}
table{border-collapse:collapse;font-size:11px;min-width:560px;width:100%}td,th{padding:6px 4px;text-align:center;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
.free{background:rgba(169,195,164,.2);color:var(--mut)}.lunch{background:rgba(214,179,94,.25)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:8px}
.wd{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.wd .card{text-align:center;font-size:12px;margin:0}.wd .card.lock{opacity:.4;filter:grayscale(1)}.wd .card.eq{outline:3px solid var(--gold)}
.wd svg{width:64px;height:64px}
.chip{display:inline-block;background:var(--line);border-radius:20px;padding:4px 10px;font-size:12px;margin:2px}
.big{font-size:34px}

.layout{max-width:980px;margin:0 auto;padding:12px 14px 90px;display:grid;gap:14px;grid-template-columns:1fr}
.side{display:flex;gap:12px;align-items:flex-start}
.pic{position:relative;flex:0 0 46%;max-width:300px;margin-bottom:12px}
.pic img{width:100%;aspect-ratio:4/5;object-fit:cover;object-position:50% 15%;border-radius:24px;border:3px solid var(--au);box-shadow:0 12px 30px -8px var(--au);display:block;transition:filter .4s}
.pic img.sad{filter:grayscale(.85) brightness(.8) contrast(1.05)}
.rib{position:absolute;left:10px;right:10px;bottom:-12px;background:var(--gold);color:#2F3E3A;border-radius:12px;text-align:center;font-size:11px;padding:4px 6px}
.ch{position:absolute;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35));line-height:1}
.info{flex:1;min-width:0}
.side .stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.side .stats div{background:var(--card);border:1px solid var(--line);padding:5px 6px;font-size:11px}
.side .big{font-size:20px}
.side .bar{background:var(--line)}
.bub{background:#FFFDF4;border:2px solid var(--gold);border-radius:18px 18px 18px 4px;padding:10px 12px;font-size:14px;line-height:1.35;color:#2F3E3A}
.bub small{display:block;color:#8A7A3E;margin-top:4px;font-size:11px}
.vl{display:flex;gap:8px;align-items:center}
@media(min-width:820px){.layout{grid-template-columns:340px 1fr;align-items:start;padding-top:24px}.side{position:sticky;top:18px;flex-direction:column}.pic{flex:none;max-width:none;width:100%}.info{width:100%}}

html:root:root:root{--bg:#090C17;--card:rgba(26,36,66,.62);--ink:#EEE8DC;--mut:#9FAAC4;--sage:#7A1F32;--sage2:#B3263E;--blue:#6C8DC4;--gold:#DDBB72;--line:rgba(150,172,220,.28);--bad:#FF5F70}
h1,h2,.d{font-family:Cinzel,Fraunces,Georgia,serif}
body{background:#090C17;overflow-x:hidden}
.scene{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(ellipse at 85% 0%,rgba(120,20,42,.6),transparent 55%),radial-gradient(ellipse at 5% 100%,rgba(30,50,115,.5),transparent 60%),linear-gradient(#0A0E1E,#070913)}
.scene::before{content:"";position:absolute;inset:0;background-image:radial-gradient(1.5px 1.5px at 12% 20%,#fff,transparent),radial-gradient(1.5px 1.5px at 30% 8%,#cfe,transparent),radial-gradient(1px 1px at 55% 25%,#fff,transparent),radial-gradient(1.5px 1.5px at 70% 12%,#fff,transparent),radial-gradient(1px 1px at 90% 30%,#fff,transparent),radial-gradient(1px 1px at 42% 40%,#fff,transparent);animation:tw 4s ease-in-out infinite alternate}

.cast{position:absolute;bottom:0;left:0;width:100%;height:30%}
.fog{position:absolute;bottom:0;left:-20%;width:140%;height:38%;background:radial-gradient(ellipse at 50% 100%,rgba(190,200,230,.17),transparent 70%);animation:drift 14s ease-in-out infinite alternate}
.bat{position:absolute;left:-60px;font-size:26px;opacity:.75;animation:fly 15s linear infinite}
.t,.card,.grid{backdrop-filter:blur(6px)}
nav{background:rgba(9,12,23,.92)}nav button{font-size:10px}
.bub{background:rgba(12,16,32,.88);color:var(--ink);box-shadow:0 0 18px -4px var(--sage2)}.bub small{color:var(--gold)}
button.b{background:linear-gradient(135deg,#B3263E,#7A1F32);color:#fff}button.g{background:linear-gradient(135deg,#DDBB72,#B8923F);color:#1b1a14}
.ck{color:#fff}.k-college{border-left-color:#6C8DC4}.k-bca{border-left-color:#B3263E}
input,textarea{font:inherit;color:var(--ink);background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%}
.pic{cursor:pointer;animation:float 4.5s ease-in-out infinite}
.pic img{transform:perspective(600px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .15s,filter .5s}
.pic.m-angry{animation:shake .45s 3,float 4.5s 1.4s ease-in-out infinite}
.pic.m-happy{animation:bounce 1.6s ease-in-out infinite}
.pic.m-sad{animation:sink 5s ease-in-out infinite}
.pic.m-smirk img{animation:smirk 1.4s ease-out 1}
.ex{position:absolute;top:-12px;left:-8px;font-size:34px;animation:pop .5s;z-index:2}
.ch{animation:float 3s ease-in-out infinite}
.fx{position:fixed;top:-30px;font-size:24px;pointer-events:none;z-index:60;animation:fall 2.4s ease-in forwards}
body.flash::after{content:"";position:fixed;inset:0;background:rgba(200,20,40,.35);z-index:55;pointer-events:none;animation:fl .7s ease-out forwards}
.mf{display:flex;gap:6px;font-size:26px;justify-content:space-between}.mf button,.wt button{background:none;border:0;font-size:24px;cursor:pointer;opacity:.45}.mf .on,.wt .on{opacity:1}
.wt{display:flex;flex-wrap:wrap;gap:2px}.hb{display:grid;grid-template-columns:70px repeat(7,1fr);gap:4px;align-items:center;font-size:11px;text-align:center}
.hb button{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--gold);background:none;color:#fff;font-size:11px;cursor:pointer;justify-self:center}.hb .on{background:var(--sage2);border-color:var(--sage2)}
.rule{display:flex;gap:10px;font-size:13px;margin-bottom:8px}.rule b{display:block}
#splash{position:fixed;inset:0;z-index:99;background:#05070E;display:flex;flex-direction:column;transition:opacity .9s,visibility .9s}
#splash.off{opacity:0;visibility:hidden}
.spw{position:absolute;inset:0;display:grid;grid-template-rows:1fr 1fr;overflow:hidden}
.spw img{width:100%;height:100%;object-fit:cover;animation:zoom 9s ease-out forwards}
.spw::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,7,14,.15),rgba(5,7,14,.55) 50%,rgba(5,7,14,.96) 88%)}
.sptxt{position:relative;margin-top:auto;padding:24px 24px calc(30px + env(safe-area-inset-bottom,0px));text-align:center;color:#EEE8DC}
.sptxt h1{font-size:34px;letter-spacing:2px;text-shadow:0 0 22px #B3263E}.sptxt p{margin:6px 0 0;color:#DDBB72;font-size:13px}
.ld{height:6px;background:rgba(255,255,255,.14);border-radius:6px;margin:16px auto;max-width:320px;overflow:hidden}.ld i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8C1F2F,#DDBB72);transition:width .3s}
@media(min-width:820px){.spw{grid-template-rows:none;grid-template-columns:1fr 1fr}}
@keyframes float{50%{transform:translateY(-6px)}}@keyframes shake{25%{transform:translateX(-7px) rotate(-1.5deg)}75%{transform:translateX(7px) rotate(1.5deg)}}
@keyframes bounce{40%{transform:translateY(-10px)}}@keyframes sink{50%{transform:translateY(5px) scale(.985)}}@keyframes smirk{0%{transform:scale(.96) rotate(-2deg);filter:brightness(1.4)}100%{transform:none}}
@keyframes pop{0%{transform:scale(0)}80%{transform:scale(1.4)}}@keyframes pulse{50%{box-shadow:0 0 90px 36px rgba(200,40,60,.5)}}@keyframes tw{to{opacity:.45}}
@keyframes drift{to{transform:translateX(8%)}}@keyframes fly{0%{transform:translate(0,0)}25%{transform:translate(30vw,-30px)}50%{transform:translate(60vw,20px)}100%{transform:translate(115vw,-20px)}}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.2}}@keyframes fl{to{opacity:0}}@keyframes zoom{from{transform:scale(1.15)}to{transform:scale(1)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}

<div id="splash"><div class="spw"><img id="spk" alt="Kiyotaka poster" style="object-position:50% 22%"><img id="spv" alt="Vanitas under the moon" style="object-position:50% 30%"></div><div class="sptxt"><h1>Midnight Academy</h1><p>Study Quest · BCA + NEET</p><div class="ld"><i id="ldb"></i></div><p id="ldt">Waking the night…</p><button class="b" id="enter" hidden style="margin-top:10px;font-size:16px;padding:12px 26px" onclick="enter()">Enter the night</button></div></div><div id="app" class="layout"></div>

<script>
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const TODAY=new Date();const TD=ds(TODAY);
let S={done:{},closed:{},level:0,xp:0,streak:0,best:0,eq:{h:0,acc:[]},tests:[],custom:{},hide:{},voice:0,last:TD,note:null,art:0};
try{const r=localStorage.getItem('sq1');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem('sq1',JSON.stringify(S))}catch(e){}};

/* timetable from college routine (3 CA I B) */
const SL=['8:30–9:20','9:30–10:20','10:30–11:20','11:30–12:20','12:30–1:20','1:30–2:20','2:30–3:20','3:30–4:20','4:30–5:20'];
const TT={1:['OS','FCS','MATH','MATH','CS','','','',''],2:['HVPE','OS','C','LINUX','CS','','','',''],3:['FCS','POM','HVPE','CS','CS Lab 1B','','','',''],
4:['C','MATH','OS','POM','','C Lab','C Lab','Linux Lab','Linux Lab'],5:['EI','EI','C','POM','','Linux Lab','Linux Lab','C Lab','']};
const END={1:'13:20',2:'13:20',3:'13:20',4:'17:20',5:'16:20'};
const DN=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const NEET={1:['Physics lecture','Chemistry'],2:['Physics lecture','Biology'],3:['Physics lecture','Chemistry'],4:['Biology','Physics lecture'],5:['Physics lecture','Biology'],6:['Physics lecture','Chemistry + Biology'],0:['Full mock test','Review mistakes']};

function sched(dt){
 const d=dt.getDay(),L=[];const T=(s,e,t,i,k,sub)=>L.push({id:s,s,e,t,i,k,sub:sub||''});
 if(d>=1&&d<=5){
  const cl=TT[d].map((c,i)=>c?SL[i].split('–')[0]+' '+c:'').filter(Boolean).join(' · ');
  T('05:30','06:00','Wake up & freshen up','🚿','care');
  T('06:00','06:30','Exercise','💪','care','Stretch, pushups, skipping');
  T('06:30','06:50','Meditate','🧘','care','Breathing, 20 minutes, phone away');
  T('06:50','07:30','Quick revision','📖','bca','Yesterday’s class notes: C, OS, Linux or Maths');
  T('07:30','08:00','Breakfast & head out','🍳','care');
  T('08:00',END[d],'College','🏫','college',cl);
  const n=NEET[d];
  if(d<=3){
   T('13:30','14:30','Lunch & rest','😴','care');
   T('14:30','16:00','NEET: '+n[0],'🎯','neet',d==1||d==3?'One-shot lecture + notes':'One-shot lecture + 30 questions');
   T('16:20','17:30','NEET: '+n[1],'🧪','neet','Revise NCERT, then solve questions');
   T('17:30','18:15','Evening walk','🌿','art','No phone, just breathe');
   T('18:15','19:15','Maths for BCA (Class 11–12)','➗','math','Sets, algebra, matrices, calculus basics');
   T('19:15','20:00','Dinner & family time','🍚','care');
   T('20:00','21:00','BCA skills','💻','bca','Code, build a project, hackathon prep, internship apps');
   T('21:00','21:40','Harmonium or drawing','🎹','art');
   T('21:40','22:00','Log wins & plan tomorrow','📝','care');
  }else if(d==4){
   T('17:30','18:00','Rest & snack','😴','care');
   T('18:00','18:45','Evening walk','🌿','art');
   T('18:45','20:00','NEET: Biology','🧬','neet','NCERT revision + questions');
   T('20:00','20:45','Dinner','🍚','care');
   T('20:45','21:30','Maths for BCA','➗','math','Practice problems');
   T('21:30','22:00','Harmonium or drawing','🎹','art');
   T('22:00','22:15','Plan tomorrow & sleep','📝','care');
  }else{
   T('16:30','17:15','Rest & snack','😴','care');
   T('17:15','18:00','Evening walk','🌿','art');
   T('18:00','19:15','NEET: Physics lecture','🎯','neet','One-shot lecture + notes');
   T('19:15','20:00','Dinner','🍚','care');
   T('20:00','21:00','BCA project / hackathon','💻','bca','Ship something small tonight');
   T('21:00','21:40','Harmonium or drawing','🎹','art');
   T('21:40','22:00','Log wins & plan tomorrow','📝','care');
  }
 }else{
  const n=NEET[d],sun=d==0;
  T('07:00','07:30','Wake up & freshen up','🚿','care');
  T('07:30','08:00','Exercise','💪','care');
  T('08:00','08:20','Meditate','🧘','care');
  T('08:20','09:00','Breakfast','🍳','care');
  T('09:00','11:00','NEET: '+n[0],'🎯','neet',sun?'Timed paper, 3 hours total from 9:00':'Lecture + notes + questions');
  T('11:15','12:45','NEET: '+n[1],'🧪','neet',sun?'Analyse every wrong answer':'NCERT + question practice');
  T('13:00','14:30','Lunch & rest','😴','care');
  T('14:30','16:00','BCA skills','💻','bca','Project, hackathons, internship applications');
  T('16:15','17:15',sun?'Weekly review & plan':'Maths for BCA','➗','math',sun?'What worked, what did not, plan the week':'Class 11–12 basics');
  T('17:30','18:30','Evening walk','🌿','art');
  T('18:30','19:30','Harmonium or drawing','🎹','art');
  T('19:30','20:30','Dinner & free time','🍚','care');
 }
 const c=(S.custom[ds(dt)]||[]);c.forEach(x=>L.push(x));
 const h=S.hide[ds(dt)]||{};
 return L.filter(x=>!h[x.id]).sort((a,b)=>a.s<b.s?-1:1);
}

 if(k=='sad'){T(392,0,.4,'sine',.12);T(311,.3,.4,'sine',.12);T(262,.6,.8,'sine',.12)}
 if(k=='equip'){T(660,0,.15,'sine');T(990,.1,.2,'sine');T(1480,.2,.3,'sine',.08)}
 if(k=='bell'){T(196,0,1.6,'sine',.18);T(392,0,1.3,'sine',.08);T(588,0,1,'sine',.05)}
}catch(e){}}
function burst(a){for(let i=0;i<22;i++){const x=document.createElement('span');x.className='fx';x.textContent=R(a);x.style.left=Math.random()*100+'vw';x.style.animationDelay=Math.random()*.8+'s';document.body.appendChild(x);setTimeout(()=>x.remove(),3600)}}
function flash(){document.body.classList.add('flash');setTimeout(()=>document.body.classList.remove('flash'),800)}
function say(t,m,v){msg=t;mood=m||'happy';if(entered){if(mood=='angry')sfx('fail');if(mood=='sad')sfx('sad')}
 if(S.voice&&v!==false&&'speechSynthesis'in window){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/[^\x00-\x7F’]/g,''));u.pitch=.55;u.rate=.92;speechSynthesis.speak(u)}catch(e){}}}
function settle(){const L=sched(TODAY),D=S.done[TD]||{},p=pct(TODAY),od=L.filter(x=>!D[x.id]&&nowM()>mins(x.e)).length;
 if(od>=3)say('You have '+od+' overdue tasks. '+R(LATE),'angry');else if(p>=70)say(R(PROUD),'happy');else if(od>=1)say(R(LATE),'cool');else say(R(READY),'cool');render()}
function later(){clearTimeout(st);st=setTimeout(settle,3200)}
function pick(m){return(m=='angry'||m=='sad')?IMG.a:((S.eq.look>=0||m=='smirk')?IMG.n:IMG.h)}
function char(m,au,acc){
 acc=acc||S.eq.acc;const fx=m=='sad'?'grayscale(.85) brightness(.8)':m=='angry'?'saturate(1.3) sepia(.25) hue-rotate(-15deg)':(REW[S.eq.fx]||{f:''}).f||'';
 return `<div class="pic m-${m}" style="--au:${au||aura()}" onclick="poke()"><img style="filter:${fx}" src="${pick(m)}" alt="${S.name} looking ${m}">${acc.map(a=>CH[a]?`<span class="ch" style="${CH[a][1]}">${CH[a][0]}</span>`:'').join('')}<span class="ex" key="${m}">${EX[m]||''}</span><div class="rib">Lv ${S.level} · ${TITLES[Math.min(S.level,9)]}</div></div>`;
}
function poke(){const x=R(POKE);sfx('equip');say(x[1],x[0]);render();later()}
function side(){
 const p=pct(TODAY),bond=Math.min(100,Math.round(S.xp/4)),jan=Math.max(0,Math.ceil((new Date(2027,0,1)-TODAY)/864e5));
 return `<aside class="side">${char(mood)}<div class="info"><div class="bub">${msg}<small>${S.name}</small></div>
 <div class="stats"><div>Level<br><b class="big d">${S.level}</b></div><div>Streak<br><b class="big d">${S.streak}🔥</b></div><div>Bond<br><b class="big d">${bond}%💗</b></div><div>To Jan 2027<br><b class="big d">${jan}d</b></div></div>
 <div class="bar"><i style="width:${p}%"></i></div><div style="font-size:12px;margin-top:6px">Today ${p}% · hit 70% to pass the level</div></div></aside>`;
}
const J=()=>(S.j[TD]=S.j[TD]||{pri:['','',''],water:0,mood:-1,grat:['','',''],notes:'',tom:''});
function sj(k,i,v){const j=J();if(i==null)j[k]=v;else j[k][i]=v;save()}
const HAB=['Read','Workout','Meditate','Journal','Vitamins'];
const WK=()=>{const d=new Date(TODAY);d.setDate(d.getDate()-((d.getDay()+6)%7));return[...Array(7)].map((_,i)=>{const x=new Date(d);x.setDate(d.getDate()+i);return ds(x)})};
function render(){
 const L=sched(TODAY),D=S.done[TD]||{};let h='';
 if(view=='today'){
  h+=`<h2 class="sec" style="margin-top:0">Today’s plan</h2>`;
  L.forEach(x=>{const late=!D[x.id]&&nowM()>mins(x.e);
   h+=`<div class="t k-${x.k} ${D[x.id]?'done':''} ${late?'late':''}"><div class="tm">${x.s}<br>${x.e}</div><div class="n">${x.i} ${x.t}${x.sub?`<small>${x.sub}</small>`:''}${late?'<small style="color:var(--bad)">overdue</small>':''}</div>
   <button class="ck" aria-label="Mark done" onclick="tog('${x.id}')">${D[x.id]?'✓':''}</button><button class="x" aria-label="Remove task" onclick="rm('${x.id}')">✕</button></div>`});
  h+=showAdd?`<div class="card"><div class="row"><input id="ns" type="time" value="20:00" style="width:auto"><input id="ne" type="time" value="21:00" style="width:auto"><input id="nt" placeholder="Task name" style="flex:1"></div><div class="row" style="margin-top:8px"><button class="b" onclick="add()">Add task</button><button class="b g" onclick="showAdd=false;render()">Cancel</button></div></div>`
   :`<div class="row"><button class="b" onclick="showAdd=true;render()">+ Add task</button><button class="b g" onclick="fin()">Close the day</button></div>`;
  h+=`<h2 class="sec">Focus timer</h2><div class="card"><div class="row" style="align-items:center;justify-content:space-between"><b class="d" id="ftm" style="font-size:30px">${fmt(fl)}</b><button class="b" onclick="focus()">${ft?'Give up':'Start 25 min'}</button></div><div style="font-size:12px;color:var(--mut);margin-top:6px">Phone away. A full session earns +15 XP and ${S.name}’s approval.</div></div>`;
 }
 if(view=='jour'){
  const j=J();
  h+=`<h2 class="sec" style="margin-top:0">Top 3 priorities</h2><div class="card">${[0,1,2].map(i=>`<input style="margin-bottom:6px" placeholder="Priority ${i+1}" value="${j.pri[i].replace(/"/g,'&quot;')}" oninput="sj('pri',${i},this.value)">`).join('')}</div>
  <h2 class="sec">Water · 8 glasses</h2><div class="card wt">${[...Array(8)].map((_,i)=>`<button class="${i<j.water?'on':''}" onclick="water(${i+1})">💧</button>`).join('')}</div>
  <h2 class="sec">Mood</h2><div class="card mf">${['😄','🙂','😐','🙁','😞'].map((f,i)=>`<button class="${j.mood==i?'on':''}" onclick="moodSet(${i})">${f}</button>`).join('')}</div>
  <h2 class="sec">Gratitude</h2><div class="card">${[0,1,2].map(i=>`<input style="margin-bottom:6px" placeholder="${i+1}." value="${j.grat[i].replace(/"/g,'&quot;')}" oninput="sj('grat',${i},this.value)">`).join('')}</div>
  <h2 class="sec">Habit tracker</h2><div class="card hb"><span></span>${['M','T','W','T','F','S','S'].map(x=>`<b>${x}</b>`).join('')}${HAB.map(hb=>`<span style="text-align:left">${hb}</span>`+WK().map(d=>`<button class="${(S.hab[hb]||{})[d]?'on':''}" onclick="hab('${hb}','${d}')">${(S.hab[hb]||{})[d]?'✓':''}</button>`).join('')).join('')}</div>
  <h2 class="sec">Notes</h2><div class="card"><textarea rows="4" oninput="sj('notes',null,this.value)" placeholder="Anything worth remembering">${j.notes}</textarea></div>
  <h2 class="sec">Tomorrow’s focus</h2><div class="card"><textarea rows="3" oninput="sj('tom',null,this.value)" placeholder="The one thing that matters tomorrow">${j.tom}</textarea></div>`;
 }
 if(view=='week'){
  h+=`<h2 class="sec" style="margin-top:0">College timetable · 3 CA I B</h2><div class="grid"><table><tr><th>Day</th>${SL.map(s=>`<th>${s}</th>`).join('')}</tr>`;
  for(let d=1;d<=5;d++)h+=`<tr><th>${DN[d].slice(0,3)}</th>${TT[d].map((c,i)=>`<td class="${c?(i==4?'lunch':''):'free'}">${c||'free'}</td>`).join('')}</tr>`;
  h+=`</table></div><h2 class="sec">Your week at a glance</h2>`;
  [1,2,3,4,5,6,0].forEach(d=>{const n=NEET[d];h+=`<div class="card"><b class="d">${DN[d]}</b><div style="font-size:12px;color:var(--mut);margin-top:4px">${d>=1&&d<=5?'College until '+END[d]+'. ':'Weekend. '}NEET: ${n.join(' + ')}. ${d==0?'Weekly review.':'BCA skills, Maths, walk, harmonium or drawing.'}</div></div>`});
 }
 if(view=='goals'){
  const jan=Math.max(0,Math.ceil((new Date(2027,0,1)-TODAY)/864e5));
  h+=`<h2 class="sec" style="margin-top:0">Goals till January 2027</h2><div class="card"><span class="chip">🎯 NEET: Physics, Chemistry, Biology revised</span><span class="chip">💻 BCA: 1 internship or hackathon</span><span class="chip">➗ Maths 11–12 basics</span><div style="margin-top:8px">${jan} days left, about ${Math.ceil(jan/7)} weeks.</div></div>
  <h2 class="sec">House rules</h2><div class="card"><div style="font-size:13px;color:var(--gold);margin-bottom:10px">“A person who controls their time, controls their future.”</div>
  <div class="rule">🎯<div><b>No motivation hunting</b>Discipline beats motivation.</div></div><div class="rule">⏰<div><b>No “I’ll start tomorrow”</b>Start today, thank yourself later.</div></div><div class="rule">📵<div><b>Phone away during study</b>Out of sight, out of mind.</div></div><div class="rule">📈<div><b>Follow the system on bad days</b>Consistency is the real flex.</div></div><div class="rule">🤫<div><b>Silent progress</b>Let your results speak.</div></div></div><h2 class="sec">Tests & exams</h2>`;
  if(!S.tests.length)h+=`<div class="card" style="color:var(--mut)">No tests yet. Add your next exam or mock below.</div>`;
  S.tests.slice().sort((a,b)=>a.d<b.d?-1:1).forEach(t=>{const dl=Math.ceil((new Date(t.d+'T00:00:00')-TODAY)/864e5);h+=`<div class="t"><div class="n">📌 ${t.n}<small>${t.d} · ${dl>=0?dl+' days left':'done'}</small></div><button class="x" onclick="dt('${t.d}','${t.n.replace(/'/g,'')}')">✕</button></div>`});
  h+=`<div class="card"><div class="row"><input id="tn" placeholder="Exam or test name" style="flex:1"><input id="td" type="date" style="width:auto"></div><button class="b" style="margin-top:8px" onclick="at()">Add test</button></div>`;
  const a=Object.keys(S.done).reduce((s,k)=>s+Object.keys(S.done[k]).filter(i=>S.done[k][i]).length,0);
  h+=`<h2 class="sec">Badges</h2><div class="card">`;
  [[S.level>=1,'🌱 First light'],[S.best>=3,'🔥 3-day streak'],[S.best>=7,'🏆 7-day streak'],[a>=50,'⭐ 50 tasks done'],[S.xp>=250,'💎 250 XP'],[S.level>=10,'👑 Level 10']].forEach(b=>h+=`<span class="chip" style="${b[0]?'background:var(--gold);color:#1b1a14':'opacity:.4'}">${b[1]}</span>`);
  h+=`</div>`;
 }
 if(view=='coll'){
  h+=`<h2 class="sec" style="margin-top:0">${S.name}’s wardrobe</h2><div style="color:var(--mut);font-size:13px;margin:0 4px 8px">Pass a level to unlock the next item. Tap to equip. He smirks every time.</div><div class="wd">`;
  REW.forEach((r,i)=>{const un=i<=S.level;const on=r.k=='aura'?(S.eq.aura|0)==i:r.k=='fx'?S.eq.fx==i:r.k=='look'?S.eq.look==i:S.eq.acc.includes(r.a);
   const em={aura:'🔮',fx:'🎞️',look:'🎩'}[r.k]||CH[r.a][0];
   h+=`<div class="card ${un?'':'lock'} ${on?'eq':''}" ${un?`onclick="wear(${i})"`:''}><span class="big">${em}</span><div>${r.n}</div><div style="color:var(--mut)">${un?(on?'Equipped':'Unlocked'):'Level '+i}</div></div>`});
  h+=`</div><h2 class="sec">${S.name}’s voice lines</h2>`;
  VL.forEach((l,i)=>{const un=i<S.level;h+=`<div class="t ${un?'':'done'}"><div class="n">${un?l:'🔒 Unlocks at level '+(i+1)}</div>${un?`<button class="ck" style="background:var(--gold);border-color:var(--gold)" onclick="say(VL[${i}],'wink');render()">▶</button>`:''}</div>`});
  h+=`<h2 class="sec">Settings</h2><div class="card"><div class="row"><input id="nm" value="${S.name}" style="flex:1"><button class="b" onclick="S.name=$('#nm').value.trim()||'Vanitas';save();render()">Rename</button></div><div class="row" style="margin-top:8px"><button class="b" onclick="S.voice=!S.voice;save();if(S.voice)say('Voice is on. Don’t make me repeat myself.','cool');render()">Voice: ${S.voice?'on':'off'}</button><button class="b" onclick="S.sfx=!S.sfx;save();sfx('equip');render()">Sounds: ${S.sfx?'on':'off'}</button><button class="b g" onclick="if(confirm('Reset everything?')){const n=S.name;S={done:{},closed:{},level:0,xp:0,streak:0,best:0,eq:{aura:0,fx:-1,look:-1,acc:[]},tests:[],custom:{},hide:{},voice:0,sfx:1,j:{},hab:{},last:TD,note:null,name:n};save();render()}">Reset progress</button></div><div style="font-size:12px;color:var(--mut);margin-top:8px">Voice uses your phone’s built-in speech. Progress saves on this device.</div></div>`;
 }
 $('#app').innerHTML=side()+'<section>'+h+'</section>';
 $('#nav').innerHTML=[['today','🗓️','Today'],['jour','📓','Journal'],['week','📚','Week'],['goals','🎯','Goals'],['coll','🎁','Rewards']].map(v=>`<button class="${view==v[0]?'on':''}" onclick="view='${v[0]}';render()"><b>${v[1]}</b>${v[2]}</button>`).join('');
}
function tog(id){S.done[TD]=S.done[TD]||{};const w=!S.done[TD][id];S.done[TD][id]=w;if(w){S.xp+=10;sfx('ding');const n=new Date();say(R(PRAISE)+' ('+pad(n.getHours())+':'+pad(n.getMinutes())+')','wink');if(pct(TODAY)==100)burst(['🦇','✨','🥀'])}else{S.xp=Math.max(0,S.xp-10);say('Unchecked? Tch. Be honest with me.','angry')}save();render();later()}
function rm(id){S.hide[TD]=S.hide[TD]||{};S.hide[TD][id]=1;save();render()}
function add(){const t=$('#nt').value.trim();if(!t)return;S.custom[TD]=S.custom[TD]||[];S.custom[TD].push({id:'c'+Date.now(),s:$('#ns').value,e:$('#ne').value,t,i:'✨',k:'bca',sub:'Added by you'});showAdd=false;save();render()}
function fin(){if(S.closed[TD]!=null){say('Today is already closed. See you tomorrow.','cool');render();return}closeDay(TODAY,false);const n=S.note;S.note=null;S.last=TD;save();
 if(n.m=='wink'){sfx('reward');burst(['🦇','✨','💎','🥀','🌙'])}else flash();say(n.t,n.m);render()}
function at(){const n=$('#tn').value.trim(),d=$('#td').value;if(!n||!d)return;S.tests.push({n,d});save();render()}
function dt(d,n){S.tests=S.tests.filter(t=>!(t.d==d&&t.n.replace(/'/g,'')==n));save();render()}
function water(n){const j=J();j.water=j.water==n?n-1:n;save();sfx('ding');if(j.water==8){S.xp+=10;save();say('Eight glasses. Hydrated and gorgeous. Fine, I’m impressed.','wink');burst(['💧','✨'])}render()}
function moodSet(i){J().mood=i;save();if(i>=3)say('Rough day? Rest if you must. Then come back to me.','cool');else say('Good. Keep that mood and study like it.','smirk');render();later()}
function hab(h,d){S.hab[h]=S.hab[h]||{};S.hab[h][d]=!S.hab[h][d];save();if(S.hab[h][d]){sfx('ding');say('Habit ticked. Small things, done daily, rule empires. 😏','wink')}render();later()}
function wear(i){const r=REW[i];if(r.k=='aura')S.eq.aura=i;else if(r.k=='fx')S.eq.fx=S.eq.fx==i?-1:i;else if(r.k=='look')S.eq.look=S.eq.look==i?-1:i;else{const a=S.eq.acc.indexOf(r.a);a>=0?S.eq.acc.splice(a,1):S.eq.acc.push(r.a)}
 save();sfx('equip');say(R(EQL),'smirk');render();later()}
function focus(){
 if(ft){clearInterval(ft);ft=null;fl=1500;say('Giving up already? Tch. Disappointing.','angry');render();return}
 ft=setInterval(()=>{fl--;const e=$('#ftm');if(e)e.textContent=fmt(fl);if(fl<=0){clearInterval(ft);ft=null;fl=1500;S.xp+=15;save();sfx('reward');burst(['✨','🦇']);say('25 minutes of pure focus. Not bad at all. +15 XP.','wink');render()}},1000);
 say('Timer’s running. Don’t look at your phone, I’ll know.','cool');render();
}
/* splash + start */
$('#spk').src=IMG.k;$('#spv').src=IMG.n;
(function(){let v=0;const iv=setInterval(()=>{v+=Math.random()*18+7;if(v>=100){v=100;clearInterval(iv);$('#enter').hidden=false;$('#ldt').textContent='The night is ready.'}$('#ldb').style.width=v+'%'},260)})();
function enter(){entered=1;sfx('bell');$('#splash').classList.add('off');say(R(ENTER),'smirk',false);render();clearTimeout(st);st=setTimeout(()=>{if(carry){say(carry.t,carry.m);render()}else settle()},3600)}
document.addEventListener('pointermove',e=>{const p=document.querySelector('.pic');if(!p)return;p.style.setProperty('--rx',(-(e.clientY/innerHeight-.5)*10)+'deg');p.style.setProperty('--ry',((e.clientX/innerWidth-.5)*14)+'deg')});
mood='smirk';render();
</script></body></html>
