<style>

a{color:var(--gold)}small.m{color:var(--mut)}

</style></head><body>
<div id="cover"><div class="cframe"><img src="img/cover.jpg" alt="Vanitas cover"></div><h1>Midnight Academy</h1><p>Where the night keeps your schedule</p>
<button class="gold" data-a="enter">Enter Academy</button>
<div class="crow"><label style="margin:0"><input type="checkbox" id="skp"> Skip opening next time</label><button class="ghost" data-a="csnd" id="csnd">♪ Music on</button></div></div>
<div id="app" class="st-big" style="display:none">
<header><div style="flex:1"><h2>Midnight Academy</h2><small id="np">—</small></div><button data-a="mprev" aria-label="Previous">⏮</button><button data-a="mtog" id="mtog" aria-label="Play or pause">♪</button><button data-a="mnext" aria-label="Next">⏭</button></header>
<section id="stage"><div id="sbg"></div><div class="dust"></div><div class="arch"><img id="e1" alt=""><img id="e2" alt=""></div><div id="elab"></div><div id="bub" data-a="poke"><span id="bt"></span></div></section>
<main id="main"></main>
<nav id="nav"></nav></div>
<div id="mini"><img id="mimg" alt=""><span id="mtxt"></span></div>
<div id="sheet"><div id="sbody"></div></div>
<script>
'use strict';
const $=s=>document.querySelector(s),p2=n=>String(n).padStart(2,'0');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dk=(d=Date.now())=>{const x=new Date(d-144e5);return x.getFullYear()+'-'+p2(x.getMonth()+1)+'-'+p2(x.getDate())}; // day rolls over at 4 AM
const addD=(k,n)=>{const x=new Date(k+'T12:00:00');x.setDate(x.getDate()+n);return dk(x.getTime())};
const lab=k=>new Date(k+'T12:00:00').toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
/* ---------- state ---------- */
const KEY='ma1';
const dflt=()=>({sd:{done:{},hide:{},custom:{}},j:{},hab:{},tests:[],goals:[{i:'🎯',t:'NEET: Physics, Chemistry, Biology revised'},{i:'💻',t:'BCA: 1 internship or hackathon'},{i:'➗',t:'Maths 11–12 basics'}],legImp:0,v:1,tasks:[],subs:['College','BCA','Coding','Personal'],arch:[],sess:[],xp:0,bond:0,streak:0,best:0,last:'',got:{},ach:{},pk:{},hist:[],lex:[],opens:0,lastOpen:0,timer:null,out:'cloak',frame:'midnight',
set:{note:0,nex:'auto',mus:1,mv:.5,sfx:1,sv:.6,rm:0,skip:0,manual:'',ctx:{cover:'t0',home:'t0',study:'',break:'t1',ward:'t0'}}});
let M,UI={pv:'tasks',sw:'day',sdt:'',sab:0,tab:'home',q:'',f:'open',s:'',sort:'due',view:'list',edit:null,fd:25,fk:'focus'};
function load(){const ex=localStorage.getItem(KEY);try{M=Object.assign(dflt(),JSON.parse(ex||'{}'))}catch(e){localStorage.setItem('ma1_corrupt',ex);M=dflt()}
 const d=dflt();M.set=Object.assign(d.set,M.set);M.set.ctx=Object.assign(d.set.ctx,M.set.ctx);
 if(!M.legImp){const r=localStorage.getItem('sq1');if(r){try{const o=JSON.parse(r),sd=M.sd;Object.keys(o.done||{}).forEach(k=>sd.done[k]=Object.assign({},o.done[k]));Object.assign(sd.hide,o.hide||{});Object.assign(sd.custom,o.custom||{});Object.assign(M.j,o.j||{});Object.assign(M.hab,o.hab||{});if(Array.isArray(o.tests)&&!M.tests.length)M.tests=o.tests.slice();M.legImp=1;localStorage.setItem(KEY,JSON.stringify(M))}catch(e){}}}
 if(!ex){const r=localStorage.getItem('sq1');if(r){try{localStorage.setItem('sq1_backup_ma',r);const o=JSON.parse(r);M.xp=o.xp|0;M.best=o.best|0;M.migrated=1}catch(e){}}save()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(M))}catch(e){toast('Storage is full')};clearTimeout(save._w);save._w=setTimeout(()=>{try{syncW()}catch(e){}},400)}
const lvl=()=>1+Math.floor(M.xp/100);
const BL=[['Stranger',0],['Acquaintance',10],['Confidant',30],['Companion',70],['Inseparable',150]];
const bl=()=>{let i=0;BL.forEach((b,j)=>{if(M.bond>=b[1])i=j});return i};
const eff=()=>{const t=dk();return M.last===t||M.last===addD(t,-1)?M.streak:0};
function award(id,x){if(M.got[id])return 0;M.got[id]=1;const a=lvl();M.xp+=x;if(lvl()>a)setTimeout(()=>{toast('Level '+lvl()+' reached');burst()},700);return x}
function bond(n,id){if(id){if(M.got[id])return;M.got[id]=1}const b=bl();M.bond+=n;if(bl()>b)setTimeout(()=>toast('Bond: '+BL[bl()][0]),900)}
function touch(){const t=dk();if(M.last===t)return;M.streak=M.last===addD(t,-1)?M.streak+1:1;M.last=t;M.best=Math.max(M.best,M.streak);
 if([3,7,14,30,60,100].includes(M.streak)){bond(3,'sk:'+M.streak);setTimeout(()=>{say('strk',{n:M.streak,an:'glow'});burst();sfx('ach')},1600)}}
/* ---------- expressions registry (page order of your PDF = V01..V43) ---------- */
const L=['','Mischievous smile','Stern, a little annoyed','Trembling laugh','Laughing','Unimpressed, tongue out','Proud','Pirate with a rose','Tea, uninterested','Startled','Laughing wholeheartedly','Deadpan face','Spooky grin','Overjoyed','Flustered','Smug advice','Amused thumbs-up','Shocked','Ecstatic','Shy','Flirting','Excessive flirting','Extremely shocked','Sleeping','Extremely cute','Pleased giggle','Happy, tea party','"Are you serious?"','Shouting','Exhausted','(duplicate of V09)','Reaching out','Presenting a card','Thinking','Terrifying grin','Magic begins','Magic swirl','Starry magic','Calm, glowing','Dramatic collapse','Disappointed','Angry in a scarf','Happy in a scarf','Smug and pleased'];
const OUT={cloak:['Midnight cloak',1,0],crimson:['Crimson captain coat',6,1],scarf:['Winter scarf',42,2]};
/* ---------- dialogue ---------- */
const R={
greet_first:[['So this is where you keep your schemes. Welcome to Midnight Academy, darling. I shall supervise.',[1,16]],['A new student. How delightful. Do try to keep up.',[33,1]]],
greet:[['Oh? Look who has finally graced my academy.',[1,16,43]],['The candles are lit and the books are sulking. Shall we begin?',[26,8]],['Ah, there you are. I had almost started to study. Almost.',[25,38]]],
greet_quick:[['Back already? Did you miss me, or just forget something?',[3,43]],['That was fast. Are you checking whether I behave when you leave?',[3,16]]],
greet_away:[['Ah, so you do remember where your academy is. How touching.',[8,5,40]],['{d} days away. I was very dignified about it. Mostly.',[27,14]],['Welcome back. No lectures. You are here now, and that counts.',[26,25]]],
greet_night:[['Studying at this hour? How deliciously gothic.',[12,1,38]],['The moon is up and so are you. Let us make it count, then sleep.',[38,15]]],
greet_due:[['{k} task(s) due today. I only remind you because I am generous.',[33,6,15]],['Today holds {k} deadline(s). Shall we deal with them before they deal with us?',[1,16]]],
greet_prog:[['Yesterday you finished {y} task(s). I noticed. Naturally.',[6,26]],['{y} done yesterday... I may be mildly impressed.',[43,25]]],
late:[['{o} overdue. No scolding. Pick the smallest one and we start there.',[33,40,26]],['Some tasks have slipped past their dates. Fixable. Choose one.',[11,26]]],
done:[['Well, well. Perhaps you can impress me after all.',[6,26]],['Another one down. The deadlines tremble.',[16,42]],['Done. I would applaud, but gloves.',[43,25]],['Satisfying, is it not? Let it go to my head, not yours.',[6,1]]],
hard:[['Excellent. I knew you could. My guidance deserves some credit, naturally.',[6,13]],['That was no small thing. Come here, darling. A little reward is in order.',[32,18,7]]],
post:[['Darling, at this rate your deadlines will graduate before you do.',[5,27]],['Postponed again? Fine. But name a smaller first step.',[33,11]]],
brk:[['Enough, then. Even brilliant minds require rest. Tea?',[8,26,15]],['Break time. I will pretend not to watch you rest.',[8,23]]],
over:[['Breathe. We choose one thing. Only one. Start with "{t}".',[26,15,31]]],
overnone:[['Nothing pending. Remarkable. Rest, or invent something ambitious.',[25,26]]],
strk:[['{n} days in a row. I am not smiling. (I am.)',[18,13,6]]],
ward:[['A dressing room. Naturally I shall judge every choice.',[16,20,6]],['Ah, the wardrobe. Try not to take all night.',[26,43]]],
poke:[['Yes? Did you need me, or just my company?',[1,20,14,11]],['Stop poking the nobility.',[2,5,28]],['Hm? Oh. Hello.',[25,38]],['Careful. I bite. Occasionally.',[12,16]]],
focus:[['Quiet now. I will be here, pretending not to watch.',[8,33]],['Focus. I am guarding the door. Mostly.',[38,35]]],
fdone:[['{m} minutes of real focus. I watched. I was impressed.',[6,43,18]],['Session complete. Your future self sends thanks.',[13,26]]],
fquit:[['Stopped early? Fine. The {m} minutes you did still count as time spent.',[26,15]]],
add:[['Another task? Write it down so it can be defeated.',[33,16]],['Noted. A plan is half a spell.',[37,1]]],
ach:[['A new achievement. Gold suits you.',[13,18,37]]],
bonds:[['Careful, darling. Keep this up and I might grow fond of you.',[14,19,20]]]};
function say(k,c={}){const pool=R[k];if(!pool)return;const rc=M.hist.slice(-12);let cd=pool.filter(l=>!rc.includes(l[0]));if(!cd.length)cd=pool;const l=cd[Math.random()*cd.length|0];
 let es=l[1].filter(e=>!M.lex.includes(e));if(!es.length)es=l[1];const e=es[Math.random()*es.length|0];
 M.lex=[e,M.lex[0]||0];M.hist.push(l[0]);M.hist=M.hist.slice(-30);const txt=l[0].replace(/\{(\w+)\}/g,(_,x)=>c[x]??'');
 setExpr(e,c.an||{hard:'zoom',post:'shake',strk:'glow',ach:'glow',greet:'rise'}[k]||'pop');type(txt);
 if(UI.tab==='plan'||UI.tab==='prog'||UI.tab==='vault'){const m=$('#mini');$('#mimg').src='img/v/V'+p2(e)+'.jpg';$('#mtxt').textContent=txt;m.style.display='flex';clearTimeout(m._t);m._t=setTimeout(()=>m.style.display='none',5200)}
